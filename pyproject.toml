[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-calculator"
version = "0.3.0"
description = "Safe local scientific and engineering calculator service"
requires-python = ">=3.9"
dependencies = ["Flask==3.0.2", "waitress>=3.0,<4"]

[project.scripts]
scientific-calculator = "scientific_calculator_service.app:main"

[tool.setuptools.package-data]
scientific_calculator_service = ["templates/*.html", "static/**/*"]

[project.optional-dependencies]
test = ["pytest>=7.4"]
