<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" role="img" aria-labelledby="t d"><title id="t">Safe expression evaluation</title><desc id="d">Expression text flows through parsing, allow-list validation, variable and angle binding, bounded evaluation, and numeric output.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#27858d"/></marker></defs><rect width="900" height="440" rx="26" fill="#edf6f3"/><rect x="28" y="28" width="844" height="70" rx="16" fill="#16464f"/><text x="55" y="58" fill="#a8e2e2" font-family="Arial" font-size="13" font-weight="700">APPROVED MATHEMATICS ONLY</text><text x="55" y="83" fill="white" font-family="Arial" font-size="21" font-weight="700">Parse → validate → bind → evaluate → report</text><g font-family="Arial"><g transform="translate(35 145)"><rect width="145" height="118" rx="14" fill="white" stroke="#bdd8d9"/><text x="15" y="29" fill="#d05c45" font-size="12" font-weight="700">01 INPUT</text><text x="15" y="59" fill="#16464f" font-size="17" font-weight="700">Expression</text><text x="15" y="88" fill="#5d7074" font-size="12">operators · names</text></g><g transform="translate(205 145)"><rect width="145" height="118" rx="14" fill="#e2f2f2" stroke="#27858d"/><text x="15" y="29" fill="#1e737a" font-size="12" font-weight="700">02 PARSE</text><text x="15" y="59" fill="#16464f" font-size="17" font-weight="700">Syntax tree</text><text x="15" y="88" fill="#5d7074" font-size="12">allow-list nodes</text></g><g transform="translate(375 145)"><rect width="145" height="118" rx="14" fill="white" stroke="#bdd8d9"/><text x="15" y="29" fill="#d05c45" font-size="12" font-weight="700">03 BIND</text><text x="15" y="59" fill="#16464f" font-size="17" font-weight="700">Context</text><text x="15" y="88" fill="#5d7074" font-size="12">values · angles</text></g><g transform="translate(545 145)"><rect width="145" height="118" rx="14" fill="#fff4e8" stroke="#e6b078"/><text x="15" y="29" fill="#b95a3e" font-size="12" font-weight="700">04 EVALUATE</text><text x="15" y="59" fill="#16464f" font-size="17" font-weight="700">Point / grid</text><text x="15" y="88" fill="#5d7074" font-size="12">finite · bounded</text></g><g transform="translate(715 145)"><rect width="145" height="118" rx="14" fill="#16464f"/><text x="15" y="29" fill="#a8e2e2" font-size="12" font-weight="700">05 OUTPUT</text><text x="15" y="59" fill="white" font-size="17" font-weight="700">Value</text><text x="15" y="88" fill="#dcebea" font-size="12">scalar · plot data</text></g></g><g stroke="#27858d" stroke-width="3" marker-end="url(#a)"><path d="M181 204H198"/><path d="M351 204H368"/><path d="M521 204H538"/><path d="M691 204H708"/></g><rect x="35" y="310" width="825" height="88" rx="15" fill="white" stroke="#bdd8d9"/><text x="60" y="345" fill="#1e737a" font-family="Arial" font-size="13" font-weight="700">ANGLE CONVENTION</text><text x="60" y="375" fill="#16464f" font-family="Georgia" font-size="24" font-weight="700">sin_deg(α) = sin(πα / 180)</text><text x="520" y="363" fill="#5d7074" font-family="Arial" font-size="13">One validated expression;</text><text x="520" y="383" fill="#5d7074" font-family="Arial" font-size="13">one bounded numerical context.</text></svg>

